<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>トレカ抽選トラッカー</title>

<!-- PWA対応：ホーム画面に追加した時にアプリらしく起動させるための設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="抽選トラッカー">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #07080f;
    --surface: #13152a;
    --surface-2: #1a1d38;
    --border: #262a4a;
    --text: #f1eef8;
    --muted: #868ebd;
    --gold: #e0b95f;
    --gold-soft: rgba(224,185,95,0.15);
    --holo-1: #e0b95f;
    --holo-2: #7ad9d6;
    --holo-3: #e88fc2;
    --win: #45dba3;
    --win-soft: rgba(69,219,163,0.14);
    --lose: #ef5f79;
    --lose-soft: rgba(239,95,121,0.14);
    --pending: #838ec4;
    --pending-soft: rgba(131,142,196,0.14);
    --mono: 'JetBrains Mono', monospace;
    --display: 'Zen Kaku Gothic New', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 380px at 12% -5%, rgba(224,185,95,0.10), transparent 55%),
      radial-gradient(ellipse 600px 400px at 100% 0%, rgba(122,217,214,0.07), transparent 55%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(232,143,194,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    padding:30px 16px 70px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  header{margin-bottom:22px; position:relative;}
  h1{
    font-family:var(--display);
    font-weight:900; font-size:25px; margin:0 0 4px; letter-spacing:0.01em;
    display:flex; align-items:center; gap:9px;
  }
  h1 .mark{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:8px; font-size:14px; color:#100b02; flex:none;
    background:linear-gradient(135deg, var(--holo-1), var(--holo-2) 55%, var(--holo-3));
    box-shadow:0 0 18px rgba(224,185,95,0.35);
  }
  h1 .accent{
    background:linear-gradient(100deg, var(--holo-1) 10%, var(--holo-3) 45%, var(--holo-2) 75%, var(--holo-1));
    background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color:var(--muted); font-size:12.5px; padding-left:39px;}
  .backup-row{display:flex; gap:8px; margin-top:12px; padding-left:39px; flex-wrap:wrap;}

  .cat-tabs{display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 22px;}
  .cat-tab{
    font-family:var(--display); font-weight:700; font-size:13px;
    padding:9px 17px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); cursor:pointer; position:relative;
    border-bottom:2.5px solid var(--border); transition:border-color .15s, color .15s;
  }
  .cat-tab.active{background:var(--surface-2); color:var(--text);}

  .crumb{display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:13px; color:var(--muted);}
  .crumb button{
    background:none; border:none; color:var(--gold); font-family:var(--display);
    font-weight:700; cursor:pointer; padding:0; font-size:13px;
  }
  .crumb .sep{color:var(--border);}
  .crumb .current{color:var(--text); font-weight:700;}

  .stats-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:24px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:""; position:absolute; top:-40%; right:-25%; width:90px;height:90px;
    background:conic-gradient(from 90deg, var(--holo-1), transparent 30%, var(--holo-2) 55%, transparent 75%, var(--holo-3) 95%);
    opacity:0.14; filter:blur(8px);
  }
  .stat-label{font-size:11px; color:var(--muted); margin-bottom:7px; letter-spacing:0.02em;}
  .stat-value{font-family:var(--mono); font-weight:800; font-size:23px; position:relative;}
  .stat-value.win{color:var(--win);}
  .stat-value.gold{color:var(--gold);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:22px;}
  .panel h2{
    font-family:var(--display); font-size:14px; margin:0 0 14px; color:var(--gold);
    display:flex; align-items:center; gap:8px; letter-spacing:0.01em;
  }
  .panel h2::before{content:"◆"; font-size:9px;}

  .shop-stats-panel summary{
    font-family:var(--display); font-size:14px; color:var(--gold); cursor:pointer;
    display:flex; align-items:center; gap:8px; letter-spacing:0.01em; list-style:none;
    -webkit-tap-highlight-color:transparent;
  }
  .shop-stats-panel summary::-webkit-details-marker{display:none;}
  .shop-stats-panel summary::before{content:"◆"; font-size:9px;}
  .shop-stats-panel summary::after{content:"▾"; margin-left:auto; color:var(--muted); font-size:12px; transition:transform .15s;}
  .shop-stats-panel[open] summary::after{transform:rotate(180deg);}
  .shop-stats-panel[open] summary{margin-bottom:14px;}

  .history-list{display:flex; flex-direction:column; gap:6px;}
  .history-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:border-color .15s;
  }
  .history-row:hover{border-color:var(--gold);}
  .history-cat-chip{
    font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:10px; border:1px solid; white-space:nowrap;
    font-family:var(--display); flex:none;
  }
  .history-box{font-family:var(--display); font-weight:700; font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .history-date{font-family:var(--mono); font-size:11px; color:var(--muted); flex:none;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:10px;}
  label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px;}
  input, select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 10px; font-size:13.5px; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft);}
  .full{grid-column:1/-1;}
  .form-actions{margin-top:14px; display:flex; gap:10px;}
  button{
    font-family:var(--display); font-weight:700; border:none; border-radius:8px;
    padding:10px 18px; cursor:pointer; font-size:13px; transition:transform 0.1s ease, opacity .15s, box-shadow .2s;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(100deg, var(--holo-1), var(--holo-3) 60%, var(--holo-1));
    background-size:200% auto; color:#181305;
  }
  .btn-primary:hover{background-position:100% 0; box-shadow:0 4px 16px rgba(224,185,95,0.3);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text); border-color:var(--muted);}

  .box-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:14px;}
  .box-card{
    position:relative; background:var(--surface); border:1px solid var(--card-glow, var(--border)); border-radius:16px;
    cursor:pointer; overflow:hidden; aspect-ratio:3/4; display:flex; flex-direction:column;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
    transition:border-color .2s, box-shadow .2s, transform .15s;
  }
  .box-card:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,0.4), 0 0 0 1px var(--card-glow, var(--gold)) inset;}
  .box-card::before{
    content:""; position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0;
    background:linear-gradient(115deg, transparent 25%, rgba(224,185,95,0.38) 42%, rgba(122,217,214,0.38) 50%, rgba(232,143,194,0.38) 58%, transparent 75%);
    background-size:250% 250%; background-position:-30% -30%;
    transition:opacity .25s;
  }
  .box-card:hover::before{opacity:1; background-position:130% 130%; transition:background-position 1s ease, opacity .25s;}
  .box-thumb{
    position:relative; flex:1; background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    background-color:var(--surface-2); outline:none; caret-color:transparent; -webkit-user-select:text;
  }
  .box-thumb::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(7,8,15,0) 30%, rgba(7,8,15,0.65) 65%, rgba(7,8,15,0.97) 100%);
  }
  .box-thumb-icon{font-size:32px; opacity:0.3; color:var(--gold); position:relative; z-index:0;}
  .box-thumb-btn{
    position:absolute; bottom:8px; left:8px; z-index:2; background:rgba(7,8,15,0.75); border:1px solid var(--border);
    color:var(--muted); font-size:10.5px; padding:4px 9px; border-radius:20px; cursor:pointer;
    font-family:var(--display);
  }
  .box-thumb-btn:hover{color:var(--gold); border-color:var(--gold);}
  .box-name{
    position:relative; z-index:1; font-family:var(--display); font-weight:700; font-size:13.5px;
    line-height:1.3; padding:0 12px 10px; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.85), 0 1px 10px rgba(0,0,0,0.6);
  }
  .box-meta{
    position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted);
    padding:9px 12px; border-top:1px solid var(--border); background:var(--surface);
  }
  .box-rate{font-family:var(--mono); font-weight:800; font-size:14px;}
  .box-price{font-family:var(--mono); font-size:10.5px; color:var(--muted);}
  .box-release{font-size:10px; font-weight:500; color:rgba(255,255,255,0.7); margin-top:2px; font-family:var(--mono);}
  .box-del{
    position:absolute; top:8px; right:8px; z-index:4; background:rgba(7,8,15,0.75); border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:3px 7px; border-radius:8px; cursor:pointer;
  }
  .box-del:hover{color:var(--lose); border-color:var(--lose);}
  .add-box-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .add-box-row input[type=text]{flex:1; min-width:180px;}
  .mini-field{display:flex; flex-direction:column; gap:3px;}
  .mini-field label{font-size:9.5px; margin:0; white-space:nowrap;}
  .file-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--muted); border-radius:8px; padding:9px 14px; font-size:12.5px; cursor:pointer;
    font-family:var(--display); white-space:nowrap;
  }
  .file-btn:hover{color:var(--text); border-color:var(--gold);}
  .file-btn.has-file{color:var(--gold); border-color:var(--gold);}
  .add-box-hint{font-size:11px; color:var(--muted); margin-top:6px;}

  .ai-panel{border-color:var(--holo-2);}
  .ai-panel h2{color:var(--holo-2);}
  .ai-panel h2::before{content:"◆"; color:var(--holo-2);}
  .ai-divider{font-size:11px; color:var(--muted); margin:10px 0 8px; display:flex; align-items:center; gap:8px;}
  .ai-divider::before, .ai-divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .ai-status{margin-top:10px; font-size:12px; min-height:16px;}
  .ai-status-loading{color:var(--muted);}
  .ai-status-ok{color:var(--win);}
  .ai-status-error{color:var(--lose);}

  .tag-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--gold);
    color:var(--gold); font-size:12px; font-family:var(--display); font-weight:700; padding:5px 6px 5px 11px; border-radius:16px;
  }
  .tag-chip button{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:11px; padding:2px 5px;
    border-radius:50%; line-height:1;
  }
  .tag-chip button:hover{color:var(--lose);}

  .upcoming-check{display:flex; align-items:center; gap:11px; cursor:pointer; flex:1; min-width:0;}
  .upcoming-check input[type=checkbox]{
    width:19px; height:19px; flex:none; accent-color:var(--gold); cursor:pointer;
  }
  .entry-date-input{
    background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text);
    font-family:var(--mono); font-size:11.5px; padding:1px 2px; width:auto; cursor:pointer;
  }
  .entry-date-input:focus{outline:none; border-bottom-color:var(--gold);}

  .price-edit-input{
    background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text);
    font-family:var(--mono); font-weight:800; font-size:20px; padding:1px 2px; width:110px;
  }
  .price-edit-input:focus{outline:none; border-bottom-color:var(--gold);}
  .price-edit-input::placeholder{color:var(--muted); font-weight:500; font-size:13px;}

  .name-edit-input{
    background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text);
    font-family:var(--display); font-weight:800; font-size:17px; padding:1px 2px; width:100%;
  }
  .name-edit-input:focus{outline:none; border-bottom-color:var(--gold);}

  .suggest-wrap{position:relative;}
  .suggest-dropdown{
    display:none; position:absolute; top:100%; left:0; right:0; z-index:60; margin-top:4px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    max-height:220px; overflow-y:auto; box-shadow:0 10px 24px rgba(0,0,0,.4);
  }
  .suggest-dropdown.open{display:block;}
  .suggest-item{padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:rgba(244,197,66,0.12); color:var(--gold);}

  .shop-filter-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .shop-filter-tab{
    font-family:var(--display); font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px;
    border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; transition:.15s;
  }
  .shop-filter-tab:hover{border-color:var(--gold); color:var(--text);}
  .shop-filter-tab.active{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}

  .shop-tag-chip{
    font-size:10px; font-weight:800; padding:2px 8px; border-radius:20px; margin-left:8px; white-space:nowrap;
  }
  .shop-tag-chip.tag-real{background:rgba(122,217,214,0.16); color:var(--holo-2);}
  .shop-tag-chip.tag-online{background:rgba(232,143,194,0.18); color:var(--holo-3);}

  .shop-edit-row{display:flex; gap:8px; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap;}
  .shop-edit-row input[type=text]{
    font-family:var(--display); font-weight:700; font-size:14px; padding:8px 10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text); width:100%;
  }
  .shop-edit-row select{
    font-family:var(--display); font-size:12.5px; padding:8px 10px; border-radius:8px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  }

  .resale-block{
    position:relative; z-index:1; margin-top:10px; padding:10px 12px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px;
  }
  .resale-row{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  .resale-row:last-of-type{margin-bottom:0;}
  .resale-profit{margin-top:6px; font-family:var(--mono); font-weight:800; font-size:14px; border-top:1px dashed var(--border); padding-top:6px;}
  .resale-hint{margin-top:6px; font-size:10.5px; color:var(--muted);}

  .shop-history-layout{display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start;}
  .shop-history-side{position:sticky; top:16px;}
  @media (max-width: 760px){
    .shop-history-layout{grid-template-columns:1fr;}
    .shop-history-side{position:static;}
  }

  /* ===== スマホ向け最適化 ===== */
  .back-bar{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .back-btn{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:var(--display); font-weight:700; font-size:13px;
    padding:8px 14px 8px 10px; border-radius:20px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .back-btn:hover{border-color:var(--gold); color:var(--gold);}
  .back-btn .arrow{font-size:15px; line-height:1;}

  @media (max-width: 600px){
    body{padding:18px 10px 60px;}
    .wrap{max-width:100%;}
    h1{font-size:18px; gap:7px;}
    h1 .mark{width:25px; height:25px; font-size:12px; border-radius:7px;}
    .subtitle{font-size:10.5px; padding-left:32px;}
    .backup-row{padding-left:0; gap:6px; margin-top:10px;}
    .backup-row .mini-btn, .backup-row label.mini-btn{font-size:10.5px; padding:6px 10px;}

    .cat-tabs{
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      margin:14px -10px 16px; padding:0 10px 4px; scrollbar-width:none;
    }
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{padding:8px 13px; font-size:12px; flex:none; white-space:nowrap;}

    .stats-row{grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:18px;}
    .stat-card{padding:10px 11px; border-radius:10px;}
    .stat-label{font-size:9.5px; margin-bottom:5px;}
    .stat-value{font-size:18px;}

    .box-grid{grid-template-columns:repeat(2, 1fr); gap:9px;}
    .box-name{font-size:11.5px; padding:0 8px 8px;}
    .box-meta{padding:7px 8px; font-size:9.5px;}
    .box-rate{font-size:12px;}
    .box-thumb-icon{font-size:24px;}
    .box-thumb-btn{font-size:9px; padding:3px 7px;}

    .panel{padding:13px; border-radius:12px; margin-bottom:16px;}
    .panel h2{font-size:12.5px;}
    .form-grid{grid-template-columns:1fr; gap:9px;}

    .card-grid{grid-template-columns:1fr; gap:9px;}
    .entry{padding:12px 12px 10px;}

    .filter-row{flex-wrap:wrap;}
    .filter-row select{min-width:0; flex:1;}

    .confirm-box, .breakdown-box{max-width:100%;}
    .breakdown-box{padding:16px;}

    .crumb{margin-bottom:10px;}
  }
  .finance-panel{margin-bottom:0;}
  .category-finance-row{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 13px; margin-bottom:10px;
  }
  .category-finance-row:last-child{margin-bottom:0;}
  .category-finance-name{
    font-family:var(--display); font-weight:700; font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:7px;
  }
  .category-finance-name .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .category-finance-line{
    display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted);
    margin-bottom:4px; font-family:var(--mono);
  }
  .category-finance-line b{color:var(--text); font-weight:600;}
  .category-finance-profit{
    margin-top:7px; padding-top:7px; border-top:1px dashed var(--border);
    font-family:var(--mono); font-weight:800; font-size:14px;
  }

  .confirm-overlay{
    position:fixed; inset:0; z-index:100; background:rgba(4,5,10,0.72);
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .confirm-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px;
    max-width:320px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .confirm-box p{font-size:13.5px; line-height:1.6; margin:0 0 18px; color:var(--text);}
  .confirm-actions{display:flex; gap:8px; justify-content:flex-end;}
  .confirm-actions .btn-ghost{padding:8px 16px;}
  .confirm-actions .btn-danger{

// Claudeのアーティファクト環境の外（スタンドアロン/PWA版）で開いた場合、window.storage は存在しないため、
// ブラウザのlocalStorageを使って同じインターフェース(get/set/delete/list)を再現する。
// これにより同じ1つのHTMLファイルが、Claude内でもスタンドアロンでもそのまま動く。
if(typeof window.storage === 'undefined'){
  const SHIM_PREFIX = 'claude_storage_shim::';
  window.storage = {
    async get(key, shared){
      try{
        const raw = localStorage.getItem(SHIM_PREFIX + key);
        if(raw === null) return null;
        return { key, value: raw, shared: !!shared };
      }catch(e){ return null; }
    },
    async set(key, value, shared){
      try{
        localStorage.setItem(SHIM_PREFIX + key, value);
        return { key, value, shared: !!shared };
      }catch(e){ return null; }
    },
    async delete(key, shared){
      try{
        localStorage.removeItem(SHIM_PREFIX + key);
        return { key, deleted: true, shared: !!shared };
      }catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const keys = [];
        const p = SHIM_PREFIX + (prefix || '');
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(p)===0) keys.push(k.slice(SHIM_PREFIX.length));
        }
        return { keys, prefix, shared: !!shared };
      }catch(e){ return null; }
    }
  };
}

function statBreakdownRows(boxes, catEntries, statuses){
  const lotteryEntries = catEntries.filter(e=>!isPurchaseType(e));
  const rows = boxes.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(b=>{
    const entries = lotteryEntries.filter(e=> e.boxId===b.id && statuses.includes(e.status));
    if(entries.length===0) return '';
    const won = entries.filter(e=>e.status==='won').length;
    const lost = entries.filter(e=>e.status==='lost').length;
    const pending = entries.filter(e=>e.status==='pending').length;
    const parts = [];
    if(statuses.includes('won') || statuses.includes('lost')) parts.push(`当選${won} / 落選${lost}`);
    if(statuses.includes('pending')) parts.push(`未発表${pending}件`);
    return `<div class="breakdown-row" onclick="closeConfirm(); openBox('${b.id}')">
      <span class="breakdown-name">${escapeHtml(b.name)}</span>
      <span class="breakdown-meta">${parts.join(' ・ ')}</span>
    </div>`;
  }).filter(Boolean).join('');
  return rows;
}

    const lotteryEntries = entries.filter(e=>!isPurchaseType(e));
    const purchaseEntries = entries.filter(e=>isPurchaseType(e));
    const won = lotteryEntries.filter(e=>e.status==='won').length;
    const lost = lotteryEntries.filter(e=>e.status==='lost').length;
    const pending = lotteryEntries.filter(e=>e.status==='pending').length;
    const purchased = purchaseEntries.filter(e=>e.status==='won').length;
    const notPurchased = purchaseEntries.length - purchased;
    const metaParts = [];
    if(lotteryEntries.length) metaParts.push(`当選${won} / 落選${lost} / 未発表${pending}`);
    if(purchaseEntries.length) metaParts.push(`購入済み${purchased} / 未購入${notPurchased}`);
    const meta = metaParts.length ? metaParts.join(' ・ ') : '記録なし';
    return `<div class="breakdown-row" onclick="closeConfirm(); openBox('${b.id}')">
      <span class="breakdown-name">${escapeHtml(b.name)}</span>
      <span class="breakdown-meta">${meta}</span>
    </div>`;
  }).join('');
  showBreakdown(`${state.category} 登録BOXの内訳（${boxes.length}件）`, rows || '<div class="empty" style="padding:24px 14px;">まだBOXが登録されていません。</div>');
}

function resizeImageFile(file, maxSize=440, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
        else{ if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    data = res && res.value ? JSON.parse(res.value) : { boxes: [], entries: [], upcoming: [], shopMeta: {} };
  }catch(e){
    data = { boxes: [], entries: [], upcoming: [], shopMeta: {} };
  }
  if(!data.upcoming) data.upcoming = [];
  if(!data.shopMeta) data.shopMeta = {};
  // 種別(抽選/通常購入)が未設定の既存データは、これまで通り「抽選」として明示的に埋めておく
  // また、時刻対応前の「日付のみ」データは datetime-local 欄に表示されるよう T00:00 を補って移行する（時刻は仮値。あとで調整可）
  let migrated = false;
  const toDateTimeCompat = v => (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v + 'T00:00' : v;
  data.entries.forEach(e=>{
    if(!e.type){ e.type = 'lottery'; migrated = true; }
    const fixed = toDateTimeCompat(e.date);
    if(fixed !== e.date){ e.date = fixed; migrated = true; }
  });
  data.upcoming.forEach(u=>{
    if(!u.type){ u.type = 'lottery'; migrated = true; }
    const fixedDate = toDateTimeCompat(u.date);
    if(fixedDate !== u.date){ u.date = fixedDate; migrated = true; }
    const fixedDeadline = toDateTimeCompat(u.deadline);
    if(fixedDeadline !== u.deadline){ u.deadline = fixedDeadline; migrated = true; }
  });
  if(migrated) save();
  renderTabs();
  render();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function isPurchaseType(e){ return !!e && e.type === 'purchase'; }
function typeLabel(type){ return type === 'purchase' ? '通常購入' : '抽選'; }

function statusLabel(s, type){
  if(type === 'purchase') return s==='won' ? '購入済み' : '未購入';
  return s==='won' ? '当選' : s==='lost' ? '落選' : '未発表';
}
function statusClass(s, type){
  if(type === 'purchase') return s==='won' ? 'status-won' : 'status-pending';
  return s==='won' ? 'status-won' : s==='lost' ? 'status-lost' : 'status-pending';
}

// 勝率は「抽選」タイプのみ対象（通常購入は外れがないため）
function rateOf(list){
  const lotteryList = list.filter(e=>!isPurchaseType(e));
  const won = lotteryList.filter(e=>e.status==='won').length;
  const lost = lotteryList.filter(e=>e.status==='lost').length;
  const d = won+lost;
  return d ? Math.round(won/d*100) : null;
}

function renameShop(oldName, newName){
  const v = (newName || '').trim();
  if(!v || v === oldName){ render(); return; }
  data.entries.forEach(e=>{ if(e.shop === oldName) e.shop = v; });
  data.upcoming.forEach(u=>{ if(u.shop === oldName) u.shop = v; });
  const oldMeta = data.shopMeta[oldName];
  if(oldMeta){
    delete data.shopMeta[oldName];
    if(!data.shopMeta[v]) data.shopMeta[v] = oldMeta;
  }
  save();
  render();
}

const SUGGEST_SOURCES = {
  shop: () => getAllShopNames(),
  boxName: () => getBoxNamesInCategory(state.category),
  newBoxCandidate: () => getCuratedBoxNameCandidates()
};

function showSuggest(inputId, sourceKey, showAll){
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(inputId + '-suggest');
  if(!input || !dropdown) return;
  const query = showAll ? '' : input.value.trim().toLowerCase();
  const source = SUGGEST_SOURCES[sourceKey] ? SUGGEST_SOURCES[sourceKey]() : [];
  const candidates = source.filter(n => !query || n.toLowerCase().includes(query)).slice(0, 40);
  const clipParent = input.closest('.entry');
  if(candidates.length === 0){
    dropdown.classList.remove('open'); dropdown.innerHTML='';
    if(clipParent) clipParent.classList.remove('suggest-clip-off');
    return;
  }
  dropdown.innerHTML = candidates.map(n=>`<div class="suggest-item" data-value="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join('');
  dropdown.classList.add('open');
  if(clipParent) clipParent.classList.add('suggest-clip-off');
}

function pickSuggest(inputId, value){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.value = value;
  input.dispatchEvent(new Event('change', {bubbles:true}));
  hideSuggest(inputId);
  input.focus();
}

function hideSuggest(inputId){
  const dropdown = document.getElementById(inputId + '-suggest');
  if(dropdown) dropdown.classList.remove('open');
  const input = document.getElementById(inputId);
  const clipParent = input && input.closest('.entry');
  if(clipParent) clipParent.classList.remove('suggest-clip-off');
}

let suggestBlurTimer = null;
function hideSuggestDelayed(inputId){
  clearTimeout(suggestBlurTimer);
  suggestBlurTimer = setTimeout(()=> hideSuggest(inputId), 150);
}

function handleSuggestMousedown(e, inputId){
  const item = e.target.closest('.suggest-item');
  if(!item) return;
  e.preventDefault();
  pickSuggest(inputId, item.dataset.value);
}


function shopStats(list){
  const map = {};
  list.forEach(e=>{
    if(!e.shop) return;
    if(!map[e.shop]) map[e.shop] = { shop: e.shop, won:0, lost:0, pending:0, purchased:0, notPurchased:0 };
    if(isPurchaseType(e)){
      if(e.status==='won') map[e.shop].purchased++;
      else map[e.shop].notPurchased++;
    } else {
      if(e.status==='won') map[e.shop].won++;
      else if(e.status==='lost') map[e.shop].lost++;
      else map[e.shop].pending++;
    }
  });
  return Object.values(map).map(s=>{
    const d = s.won + s.lost;
    return { ...s, total: d + s.pending + s.purchased + s.notPurchased, rate: d ? Math.round(s.won/d*100) : null };
  }).sort((a,b)=>{
    if(a.rate===null && b.rate===null) return b.total-a.total;
    if(a.rate===null) return 1;
    if(b.rate===null) return -1;
    return b.rate-a.rate;
  });
}

function renderShopStatsHtml(list, emptyMsg){
  const stats = shopStats(list);
  if(stats.length===0){
    return `<div class="empty">${emptyMsg}</div>`;
  }
  return `<div class="shop-stats-list">` + stats.map(s=>`
    <div class="shop-stat-row">
      <div>
        <div class="shop-stat-name">${escapeHtml(s.shop)}</div>
        <div class="shop-stat-detail">当選 ${s.won} / 落選 ${s.lost}${s.pending?` / 未発表 ${s.pending}`:''}${(s.purchased||s.notPurchased)?` ・ 購入済み ${s.purchased} / 未購入 ${s.notPurchased}`:''}</div>
      </div>
      <div class="shop-stat-rate" style="color:${s.rate!==null?'var(--win)':'var(--muted)'}">${s.rate!==null ? s.rate+'%' : '—'}</div>
    </div>
  `).join('') + `</div>`;
}

function extractImageFromClipboard(e){
  const items = (e.clipboardData || window.clipboardData)?.items;
  if(!items) return null;
  for(const item of items){
    if(item.type && item.type.startsWith('image/')) return item.getAsFile();
  }
  return null;
}

async function handleThumbPaste(e, boxId){
  const imageFile = extractImageFromClipboard(e);
  e.preventDefault();
  e.stopPropagation();
  e.target.textContent = '';
  if(!imageFile) return;
  const box = data.boxes.find(b=>b.id===boxId);
  if(!box) return;
  try{
    box.thumbnail = await resizeImageFile(imageFile);
    save();
    render();
  }catch(err){
    showMessage('画像の貼り付けに失敗しました');
  }
}

function handleNewBoxPaste(e){

// datetime-local用の値（YYYY-MM-DDTHH:mm）と、日付のみ（YYYY-MM-DD）の両方を扱うためのヘルパー。
// 既存データが日付のみで保存されている場合もそのまま表示・計算できるようにする。
function fmtDateTime(v){
  if(!v) return '';
  if(v.length <= 10) return v; // 時刻情報がない古いデータ
  const [d,t] = v.split('T');
  return d + ' ' + (t||'').slice(0,5);
}

// AI読み取りなどで日付だけが分かっている場合に、時刻欄付きの入力へ流し込むための値を作る。
// 時刻が不明な場合は 00:00 を仮でセットするので、ユーザーが分かる範囲で調整してもらう想定。
function toDateTimeValue(dateOnly, timeOnly){
  if(!dateOnly) return '';
  return dateOnly + 'T' + (timeOnly && /^\d{2}:\d{2}$/.test(timeOnly) ? timeOnly : '00:00');
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const datePart = (dateStr || '').slice(0,10);
  const target = new Date(datePart + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function getUpcomingCombined(windowDays=3, overdueDays=14){
  const announce = data.entries
    .filter(e=> e.status==='pending' && e.date)
    .map(e=>{
      const box = data.boxes.find(b=>b.id===e.boxId);
      return {
        type:'announce', entryType: e.type || 'lottery', diff: daysUntil(e.date), date:e.date, shop:e.shop,
        category: box ? box.category : state.category, boxName: box ? box.name : '',
        boxId: e.boxId
      };
    });

  const apply = data.upcoming
    .filter(u=> u.date)
    .map(u=>({
      type:'apply', entryType: u.type || 'lottery', diff: daysUntil(u.date), date:u.date, shop:u.shop,
      category:u.category, boxName:u.boxName, upcomingId:u.id
    }));

  const deadline = data.upcoming
    .filter(u=> u.deadline)
    .map(u=>({
      type:'deadline', entryType: u.type || 'lottery', diff: daysUntil(u.deadline), date:u.deadline, shop:u.shop,
      category:u.category, boxName:u.boxName, upcomingId:u.id
    }));

  return [...announce, ...apply, ...deadline]
    .filter(x=> x.diff <= windowDays && x.diff >= -overdueDays)
    .sort((a,b)=> a.diff - b.diff);
}

function whenLabel(diff){
  if(diff < 0) return { text:`${Math.abs(diff)}日超過`, cls:'overdue' };
  if(diff === 0) return { text:'本日', cls:'today' };
  if(diff <= 3) return { text:`${diff}日後`, cls:'soon' };
  return { text:`${diff}日後`, cls:'later' };
}

const UPCOMING_TYPE_LABEL_PURCHASE = { announce:'購入待ち', apply:'購入開始', deadline:'受付終了' };
function upcomingTypeLabel(x){

function renderShopHistoryView(){
  const enriched = data.entries.map(e=>{
    const box = data.boxes.find(b=>b.id===e.boxId);
    return { ...e, boxName: box ? box.name : '(削除済みBOX)', category: box ? box.category : '', box };
  });

  const shopMap = {};
  enriched.forEach(e=>{
    if(!e.shop) return;
    if(!shopMap[e.shop]) shopMap[e.shop] = [];
    shopMap[e.shop].push(e);
  });

  const shops = Object.keys(shopMap).map(shop=>{
    const list = shopMap[shop];
    const lotteryList = list.filter(e=>!isPurchaseType(e));
    const purchaseList = list.filter(e=>isPurchaseType(e));
    const won = lotteryList.filter(e=>e.status==='won').length;
    const lost = lotteryList.filter(e=>e.status==='lost').length;
    const pending = lotteryList.filter(e=>e.status==='pending').length;
    const purchased = purchaseList.filter(e=>e.status==='won').length;
    const notPurchased = purchaseList.length - purchased;
    const rate = rateOf(list);
    return { shop, tag: getShopTag(shop), list: list.sort((a,b)=> (b.date||'').localeCompare(a.date||'')), won, lost, pending, purchased, notPurchased, total: list.length, rate };
  }).sort((a,b)=>{
    if(a.rate===null && b.rate===null) return b.total-a.total;
    if(a.rate===null) return 1;
    if(b.rate===null) return -1;
    return b.rate-a.rate;
  });

  const shopsShown = state.shopFilter==='all' ? shops
    : state.shopFilter==='none' ? shops.filter(s=>!s.tag)
    : shops.filter(s=>s.tag===state.shopFilter);

  const totalEntries = enriched.length;
  const overallRate = rateOf(enriched);

  const categoryFinance = CATEGORIES.map(cat=>{
    const wonEntries = enriched.filter(e=> e.category===cat && e.status==='won');
    const invested = wonEntries.reduce((sum,e)=> sum + (e.box && e.box.price!=null ? e.box.price : 0), 0);
    const investedCount = wonEntries.filter(e=> e.box && e.box.price!=null).length;
    const soldEntries = wonEntries.filter(e=> e.resalePrice!=null);
    const resold = soldEntries.reduce((sum,e)=> sum + e.resalePrice, 0);
    const profits = soldEntries.map(e=> entryProfit(e, e.box)).filter(p=>p!=null);
    const profit = profits.length ? profits.reduce((a,b)=>a+b,0) : null;
    return { category:cat, invested, investedCount, resold, soldCount:soldEntries.length, heldCount: wonEntries.length - soldEntries.length, profit };
  }).filter(c=> c.investedCount>0 || c.soldCount>0);

  const shopFilterTabs = [
    { key:'all', label:'すべて' },
    { key:'実店舗', label:'実店舗' },
    { key:'オンライン', label:'オンライン' },
    { key:'none', label:'未設定' }
  ];

  let leftHtml = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">登録店舗数</div>
        <div class="stat-value">${shops.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">総エントリー数（全カテゴリ）</div>
        <div class="stat-value">${totalEntries}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">全体勝率</div>
        <div class="stat-value gold">${overallRate!==null ? overallRate+'%' : '—'}</div>
      </div>
    </div>
  `;

  if(shops.length>0){
    leftHtml += `<div class="shop-filter-tabs">` + shopFilterTabs.map(t=>
      `<button class="shop-filter-tab ${state.shopFilter===t.key?'active':''}" onclick="setShopFilter('${t.key}')">${t.label}</button>`
    ).join('') + `</div>`;
  }

  if(shops.length===0){
    leftHtml += `<div class="empty">まだ抽選記録がありません。</div>`;
  }else if(shopsShown.length===0){
    leftHtml += `<div class="empty">該当する店舗がありません。</div>`;
  }else{
    leftHtml += shopsShown.map(s=>{
      const shopSafe = escapeHtml(s.shop);
      const inputId = 'shopNameEdit-' + s.shop.replace(/[^a-zA-Z0-9]/g,'').slice(0,20) + '-' + Math.abs([...s.shop].reduce((h,c)=>h*31+c.charCodeAt(0)|0,0));
      return `
      <details class="panel shop-stats-panel">
        <summary>
          <span>${shopSafe}</span>
          ${s.tag ? `<span class="shop-tag-chip ${s.tag==='実店舗'?'tag-real':'tag-online'}">${s.tag}</span>` : ''}
          <span style="margin-left:auto; margin-right:10px; font-family:var(--mono); font-weight:800; font-size:14px; color:${s.rate!==null?'var(--win)':'var(--muted)'};">${s.rate!==null ? s.rate+'%' : '—'}</span>
        </summary>
        <div class="shop-stats-body">
          <div class="shop-edit-row">
            <div class="suggest-wrap" style="flex:1; min-width:140px;">
              <input type="text" id="${inputId}" data-shop="${shopSafe}" value="${shopSafe}" placeholder="店舗名"
                onclick="event.stopPropagation()"
                oninput="showSuggest('${inputId}','shop')" onfocus="this.select(); showSuggest('${inputId}','shop',true)" onblur="hideSuggestDelayed('${inputId}')"
                onchange="renameShop(this.dataset.shop, this.value)">
              <div class="suggest-dropdown" id="${inputId}-suggest" onmousedown="event.stopPropagation(); handleSuggestMousedown(event,'${inputId}')"></div>
            </div>
            <select data-shop="${shopSafe}" onclick="event.stopPropagation()" onchange="setShopTag(this.dataset.shop, this.value)">
              <option value="" ${!s.tag?'selected':''}>タグ未設定</option>
              <option value="実店舗" ${s.tag==='実店舗'?'selected':''}>実店舗</option>
              <option value="オンライン" ${s.tag==='オンライン'?'selected':''}>オンライン</option>
            </select>
          </div>

      </details>
    `;

  }

  const rightHtml = `
    <div class="panel finance-panel">
      <h2>カテゴリ別 投資額・売却額</h2>
      ${categoryFinance.length===0 ? `<div class="empty" style="padding:24px 14px;">まだ当選・売却の記録がありません。</div>` : categoryFinance.map(c=>{
        const color = CATEGORY_COLORS[c.category] || 'var(--gold)';

          <div class="category-finance-row">
            <div class="category-finance-name"><span class="dot" style="background:${color};"></span>${escapeHtml(c.category)}</div>
            <div class="category-finance-line"><span>累計投資額（${c.investedCount}個）</span><b>¥${c.invested.toLocaleString()}</b></div>
            <div class="category-finance-line"><span>累計売却額（${c.soldCount}個）</span><b>¥${c.resold.toLocaleString()}</b></div>
            <div class="category-finance-line"><span>保有中</span><b>${c.heldCount}個</b></div>
            <div class="category-finance-profit" style="color:${c.profit===null?'var(--muted)':c.profit>=0?'var(--win)':'var(--lose)'}">

            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  const html = `
    <div class="shop-history-layout">
      <div class="shop-history-main">${leftHtml}</div>
      <div class="shop-history-side">${rightHtml}</div>
    </div>
  `;

  document.getElementById('mainArea').innerHTML = html;
}

function viewShopHistoryOpenBox(boxId){
  const box = data.boxes.find(b=>b.id===boxId);

  state.category = box.category;
  state.view = 'box-detail';

  renderTabs();
  render();
}

function renderEntryList(){
  const box = data.boxes.find(b=>b.id===state.boxId);
  if(!box) return;
  const filterShop = document.getElementById('filterShop').value;
  const filterType = document.getElementById('filterType').value;
  const filterStatus = document.getElementById('filterStatus').value;

  let list = data.entries.filter(e=>e.boxId===box.id);
  if(filterShop) list = list.filter(e=>e.shop===filterShop);
  if(filterType) list = list.filter(e=> (e.type||'lottery') === filterType);
  if(filterStatus) list = list.filter(e=>e.status===filterStatus);
  list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  document.getElementById('countBadge').textContent = `${list.length}件`;

  const area = document.getElementById('entryListArea');
  if(list.length===0){
    area.innerHTML = '<div class="empty">まだ記録がありません。上のフォームから抽選を登録してください。</div>';
    return;
  }

  area.innerHTML = `<div class="card-grid">` + list.map(e=>{
    const purchaseType = isPurchaseType(e);
    const profit = e.status==='won' ? entryProfit(e, box) : null;
    const resaleBlock = e.status==='won' ? `
      <div class="resale-block">
        <div class="resale-row">
          <span>売却価格</span>
          <input type="number" min="0" step="1" class="entry-date-input" value="${e.resalePrice!=null ? e.resalePrice : ''}" placeholder="未売却" onclick="event.stopPropagation()" onchange="updateEntryResalePrice('${e.id}', this.value)">
        </div>
        <div class="resale-row">
          <span>売却日</span>
          <input type="date" class="entry-date-input" value="${e.resaleDate || ''}" onclick="event.stopPropagation()" onchange="updateEntryResaleDate('${e.id}', this.value)">
        </div>
        ${profit!==null ? `<div class="resale-profit" style="color:${profit>=0?'var(--win)':'var(--lose)'}">損益：${profit>=0?'+':''}¥${profit.toLocaleString()}</div>` : (box.price==null ? `<div class="resale-hint">※定価が未設定です</div>` : '')}
      </div>
    ` : '';
    const actionButtons = purchaseType ? (
      e.status==='won'
        ? `<button class="mini-btn" onclick="updateStatus('${e.id}','pending')">未購入に戻す</button>`
        : `<button class="mini-btn win-btn" onclick="updateStatus('${e.id}','won')">購入済みにする</button>`
    ) : `
        <button class="mini-btn win-btn" onclick="updateStatus('${e.id}','won')">当選にする</button>
        <button class="mini-btn lose-btn" onclick="updateStatus('${e.id}','lost')">落選にする</button>
        <button class="mini-btn" onclick="updateStatus('${e.id}','pending')">未発表に戻す</button>
    `;
    return `
    <div class="entry">
      <div class="entry-top">
        <div class="suggest-wrap" style="flex:1; max-width:75%;">
          <input type="text" id="entryShop-${e.id}" class="entry-shop-input" style="width:100%; max-width:none;" value="${escapeHtml(e.shop)}"
            onclick="event.stopPropagation()"
            oninput="showSuggest('entryShop-${e.id}','shop')" onfocus="this.select(); showSuggest('entryShop-${e.id}','shop',true)" onblur="hideSuggestDelayed('entryShop-${e.id}')"
            onchange="updateEntryShop('${e.id}', this.value)">
          <div class="suggest-dropdown" id="entryShop-${e.id}-suggest" onmousedown="event.stopPropagation(); handleSuggestMousedown(event,'entryShop-${e.id}')"></div>
        </div>
        <span class="status-tag ${statusClass(e.status, e.type)}">${statusLabel(e.status, e.type)}</span>
      </div>
      <div class="entry-top" style="margin-top:-4px;">
        <select class="type-select ${purchaseType?'type-purchase':'type-lottery'}" onclick="event.stopPropagation()" onchange="updateEntryType('${e.id}', this.value)">
          <option value="lottery" ${purchaseType?'':'selected'}>抽選</option>
          <option value="purchase" ${purchaseType?'selected':''}>通常購入</option>
        </select>
      </div>
      <div class="entry-dates">${purchaseType?'購入日':'発表日'}：<input type="datetime-local" class="entry-date-input" value="${e.date || ''}" onclick="event.stopPropagation()" onchange="updateEntryDate('${e.id}', this.value)"></div>
      ${resaleBlock}
      <div class="entry-edit-row">
        <div class="entry-edit-label">${purchaseType?'購入URL':'抽選URL'}（任意）</div>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="text" class="entry-edit-input" placeholder="https://..." value="${escapeHtml(e.url || '')}" onclick="event.stopPropagation()" onchange="updateEntryUrl('${e.id}', this.value)">
          ${e.url ? `<a href="${escapeHtml(e.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="開く" style="flex:none; color:var(--gold); font-size:13px;">↗</a>` : ''}
        </div>
      </div>
      <div class="entry-edit-row">
        <div class="entry-edit-label">メモ（任意）</div>
        <input type="text" class="entry-edit-input" placeholder="受け取り期限・応募条件など" value="${escapeHtml(e.memo || '')}" onclick="event.stopPropagation()" onchange="updateEntryMemo('${e.id}', this.value)">
      </div>
      <div class="entry-actions">
        ${actionButtons}
        <button class="mini-btn del-btn" onclick="removeEntry('${e.id}')">削除</button>
      </div>
    </div>
  `;
  }).join('') + `</div>`;
}

document.addEventListener('paste', async (e)=>{
  const items = (e.clipboardData || window.clipboardData)?.items;
  if(!items) return;
  let imageFile = null;
  for(const item of items){
    if(item.type && item.type.startsWith('image/')){
      imageFile = item.getAsFile();
      break;
    }
  }
  if(!imageFile) return;

  if(pendingThumbBoxId){
    e.preventDefault();
    const box = data.boxes.find(b=>b.id===pendingThumbBoxId);
    pendingThumbBoxId = null;
    if(!box) return;
    try{
      box.thumbnail = await resizeImageFile(imageFile);
      save();
      render();
    }catch(err){
      showMessage('画像の貼り付けに失敗しました');
    }
  } else if(state.view === 'boxes'){
    e.preventDefault();
    newBoxImageFile = imageFile;
    const label = document.getElementById('newBoxImageLabel');
    if(label){
      label.textContent = '🖼 画像貼り付け済み';
      label.classList.add('has-file');
    }
  }
});

load();

// PWA：Service Workerを登録（sw.jsが同じ場所に無い/使えない環境では何もしない）
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* Claudeのアーティファクト内など、sw.jsが無い環境では何もしない */ });
  });
}
</script>
